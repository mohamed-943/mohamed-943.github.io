# Intégration continue : chaque push et chaque pull request sont vérifiés.
# Cours DevOps — phases BUILD et TEST.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualité, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Analyse statique (oxlint)
        run: npm run lint

      - name: Types (TypeScript)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Budget de poids (JS principal < 600 Ko)
        run: |
          size=$(find dist/assets -name 'index-*.js' -exec stat -c %s {} + | sort -n | tail -1)
          echo "Bundle principal : $size octets"
          test "$size" -lt 600000

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker:
    name: Image Docker, test de fumée et scan de sécurité
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: portfolio:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de fumée (le conteneur répond et sert les routes React)
        run: |
          docker run -d --name web -p 8080:8080 portfolio:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
          curl -fs http://localhost:8080/projets/sentinel | grep -q '<div id="root">'
          curl -fsI http://localhost:8080/ | grep -qi 'content-security-policy'
          docker logs web

      - name: Scan de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0

        with:
          image-ref: portfolio:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
